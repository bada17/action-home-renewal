<!-- /77 함께하기: 두 번째 코드 위젯. layout 조각 바로 다음에 둡니다. -->
<!-- /81·/82 기본 게시판 위젯을 이 사이에 넣지 않습니다. -->
<!-- 원본은 issue.html입니다. 이 생성 파일을 직접 고치지 마세요. -->
<script>
/* ═══════════════════════════════════════════════════════════════
   캠페이너스 캠페인 게시판 자동 연결

     /81  진행 중 → 홈 첫 화면 + 이 화면의 진행 중 탭
     /82  종료     → 이 화면의 종료 탭

   action.or.kr/rss 의 글 주소에 들어 있는 게시판 번호로 나눕니다.
   제목을 `[링크:https://외부주소] 제목 — 한 줄 설명`으로 쓰면 카드가 그 주소를
   새 탭으로 열고, [링크:...] 표시는 카드에서 숨깁니다. `[링크:/내부주소]`는 같은
   탭에서 엽니다. 링크 표시가 없거나 주소가 안전하지 않으면 해당 게시글로 이동합니다.
   RSS가 끊기거나 게시판에 글이 아직 없으면 아래 HTML 씨앗을 그대로 둡니다.
   ═══════════════════════════════════════════════════════════════ */
(function () {
  // 미리보기나 다른 연결 코드가 이미 값을 넣었다면 그 값을 우선합니다.
  if (window.AH_DATA && Object.prototype.toString.call(window.AH_DATA.issues) === '[object Array]') return;

  function nodeText(node, tag) {
    var el = node.getElementsByTagName(tag)[0];
    return el ? String(el.textContent || '').trim() : '';
  }
  function splitTitle(raw) {
    var bits = String(raw || '').split(/\s+—\s+/);
    return { title: bits.shift() || '', lead: bits.join(' — ') };
  }
  function campaignTitle(raw, postUrl) {
    var text = String(raw || '').trim();
    var match = text.match(/^\[링크:([^\]]+)\]\s*/);
    var url = postUrl;
    var newTab = false;

    if (match) {
      text = text.slice(match[0].length);
      try {
        var wanted = String(match[1] || '').trim();
        var parsed = new URL(wanted, window.location.origin);
        var internal = wanted.charAt(0) === '/' && wanted.charAt(1) !== '/'
          && parsed.origin === window.location.origin;
        var secureExternal = /^https:\/\//i.test(wanted) && parsed.protocol === 'https:';
        if (internal) url = parsed.pathname + parsed.search + parsed.hash;
        if (!internal && secureExternal) {
          url = parsed.href;
          newTab = true;
        }
      } catch (e) { /* 잘못된 주소면 게시글 링크를 그대로 씁니다. */ }
    }

    var shown = splitTitle(text);
    return { title: shown.title, lead: shown.lead, url: url, newTab: newTab };
  }
  function boardPath(link) {
    try { return new URL(link, window.location.href).pathname.replace(/\/+$/, ''); }
    catch (e) { return ''; }
  }
  function post(item) {
    var postUrl = nodeText(item, 'link');
    var raw = campaignTitle(nodeText(item, 'title'), postUrl);
    var media = item.getElementsByTagName('media:content')[0];
    return {
      kind: '캠페인',
      title: raw.title,
      lead: raw.lead,
      url: raw.url,
      newTab: raw.newTab,
      postUrl: postUrl,
      img: media ? (media.getAttribute('url') || '') : '',
      tile: '#0079a6'
    };
  }

  fetch('/rss', { credentials: 'same-origin' })
    .then(function (res) {
      if (!res.ok) throw new Error('RSS ' + res.status);
      return res.text();
    })
    .then(function (xmlText) {
      var xml = new DOMParser().parseFromString(xmlText, 'application/xml');
      if (xml.getElementsByTagName('parsererror').length) throw new Error('RSS XML');

      var on = [], off = [];
      Array.prototype.forEach.call(xml.getElementsByTagName('item'), function (item) {
        var row = post(item);
        // 카드 목적지가 외부여도 어느 게시판 글인지는 원래 글 주소로 판별합니다.
        var path = boardPath(row.postUrl);
        if (path === '/81') on.push(row);
        if (path === '/82') off.push(row);
      });

      // 빈 새 게시판 때문에 지금 카드가 사라지지 않게, 글이 있을 때만 켭니다.
      if (!on.length && !off.length) return;
      var data = window.AH_DATA && typeof window.AH_DATA === 'object' ? window.AH_DATA : {};
      if (on.length) data.issues = on;
      if (off.length) data.issuesDone = off;
      window.AH_DATA = data;
      window.dispatchEvent(new CustomEvent('ah-campaigns-ready', { detail: data }));
    })
    .catch(function () { /* 연결 실패 때는 HTML 씨앗을 그대로 보여 줍니다. */ });
})();
</script>

<script>
/* ═══════════════════════════════════════════════════════════════
   내용 갈아 끼우는 자리 — window.AH_DATA          ← 자세한 것은 CONTENT.md

   홈(index.html)에 낸 것과 같은 자리입니다. 위 자동 연결기가 캠페이너스 게시판
   값을 window.AH_DATA 에 담으면 이 스크립트가 목록을 다시 그립니다.

     D.issues      진행 중 (홈 첫 화면에 올라가는 것과 같은 다섯)
     D.issuesDone  종료  ← 이 화면에만 있습니다. 홈 첫 화면에는 안 올라갑니다

   ★ 값이 없으면 아무것도 하지 않습니다. 아래 HTML 에 적힌 카드가 그대로 남습니다.
     그래서 게시판이 끊겨도 화면이 비지 않습니다('켜는 것만 스크립트가 한다' 원칙).
     단, HTML 에 남은 것은 씨앗이지 진짜 내용이 아닙니다. 낡을 수 있습니다.

   ⚠ 이 스크립트는 아래 탭 스크립트보다 **먼저** 돌아야 합니다.
     순서를 바꾸면 새로 그린 카드에 탭이 안 붙습니다.
   ⚠ 마감일 줄은 씨앗에서 접혀 있습니다(2026-08-31 지시). 여기서도 안 그립니다.
     대신 data-due 만 붙여, 나중에 다시 펴더라도 날짜 세기가 그대로 돕니다.
   ═══════════════════════════════════════════════════════════════ */
(function () {
  // 게시판 글에 들어있는 꺾쇠가 화면을 깨뜨립니다. 반드시 거칩니다.
  function esc(v) {
    var d = document.createElement('div');
    d.textContent = (v === null || v === undefined) ? '' : String(v);
    return d.innerHTML;
  }
  function some(a) { return Object.prototype.toString.call(a) === '[object Array]' && a.length > 0; }
  function two(t) { return String(t || '').replace(/[\s\[\]]/g, '').slice(0, 2); }
  function linkAttrs(it) {
    return it && it.newTab
      ? ' target="_blank" rel="noopener noreferrer" aria-label="' + esc((it.title || '캠페인') + ' (새 창)') + '"'
      : '';
  }
  function newWindowMark(it) {
    return it && it.newTab ? '<span class="new-window" aria-hidden="true">↗</span>' : '';
  }

  /* 카드 한 장. 액자는 홈과 달리 흐린 바탕을 안 깝니다 —
     이 화면의 .card-shot 은 매트 색(--band)이 카드마다 같아야 통일감이 나기 때문입니다. */
  function card(it, done) {
    var shot = it.img
      ? '<img src="' + esc(it.img) + '" alt="' + esc(it.title) + '" loading="lazy">'
      : '<span class="mark" aria-hidden="true">' + esc(it.mark || two(it.title)) + '</span>';

    return '<a class="card' + (done ? ' done' : '') + '" href="' + esc(it.url || '#') + '"' + linkAttrs(it)
         +   ' style="--tile:' + esc(it.tile || '#0079a6') + '"'
         +   (it.due ? ' data-due="' + esc(it.due) + '"' : '') + '>'
         +   '<span class="card-shot">' + shot + '</span>'
         +   '<span class="card-in">'
         +     '<h3>' + esc(it.title) + newWindowMark(it) + '</h3>'
         +     '<p>' + esc(it.lead) + '</p>'
         +     (done && it.when ? '<span class="due"><b class="dday">종료</b>' + esc(it.when) + '</span>' : '')
         +   '</span>'
         + '</a>';
  }

  /* 목록 하나를 갈아 끼우고, 탭에 붙은 개수도 같이 고칩니다.
     개수를 안 고치면 탭은 5 라고 하는데 카드는 3 장인 화면이 됩니다. */
  function fill(listId, tabId, rows, done) {
    if (!some(rows)) return;
    var box = document.getElementById(listId);
    if (!box) return;
    var html = '';
    rows.forEach(function (it) { html += card(it, done); });
    box.innerHTML = html;

    var n = document.querySelector('#' + tabId + ' .n');
    if (n) n.textContent = rows.length;
  }

  function render(D) {
    if (!D || typeof D !== 'object') return;
    fill('list-on',  'tab-on',  D.issues,     false);
    fill('list-off', 'tab-off', D.issuesDone, true);
  }

  render(window.AH_DATA);
  window.addEventListener('ah-campaigns-ready', function (e) {
    render((e && e.detail) || window.AH_DATA);
  });
})();
</script>

<script>
/* 진행 중 / 종료 탭. 목록 두 개를 번갈아 보여 주기만 합니다.
   ⚠️ 캠페이너스 코드 위젯이 <script> 를 실행해 주는지는 /69 에서 확인해야 합니다.
      막히면 탭이 안 넘어갑니다. 그때는 두 목록을 위아래로 나란히 두는 쪽으로 바꿉니다
      (hidden 을 떼면 바로 그 모양이 됩니다). */
(function () {
  var tabs = [
    { btn: document.getElementById('tab-on'),  panel: document.getElementById('list-on') },
    { btn: document.getElementById('tab-off'), panel: document.getElementById('list-off') }
  ];
  if (tabs.some(function (t) { return !t.btn || !t.panel; })) return;

  tabs.forEach(function (t) {
    t.btn.addEventListener('click', function () {
      tabs.forEach(function (o) {
        var on = o === t;
        o.btn.setAttribute('aria-selected', on ? 'true' : 'false');
        o.panel.hidden = !on;
      });
    });
  });
})();

/* 남은 날짜 세기 — 홈과 같은 방식입니다.
   카드의 data-due="2026-08-31" 을 읽어 data-dday 자리 글자를 'D-5' 로 바꿉니다.
   HTML 에는 '8/31' 이 그대로 적혀 있어, 이 스크립트가 막혀도 틀린 값이 뜨지 않습니다.
   날짜를 손으로 D-day 로 적지 마세요 — 내일이면 틀립니다. */
(function () {
  var cards = document.querySelectorAll('#iss [data-due]');
  if (!cards.length) return;

  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  Array.prototype.forEach.call(cards, function (card) {
    var slot = card.querySelector('[data-dday]');
    if (!slot) return;

    var p = card.getAttribute('data-due').split('-');
    var due = new Date(+p[0], +p[1] - 1, +p[2]);
    if (isNaN(due)) return;

    var days = Math.round((due - today) / 86400000);
    if (days < 0) return;                       // 이미 지난 것은 건드리지 않습니다
    slot.textContent = days === 0 ? '오늘 마감' : 'D-' + days;
  });
})();
</script>
