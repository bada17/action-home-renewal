<!-- CAMPAIGNERS:ACTIVITY-BUDGET-TRACKER START -->
<!-- /27 예산 감시 : 이 코드를 기본 게시판 위젯 바로 위의 코드 위젯에 붙입니다(PC·모바일).
     최근 글 2장 + 「미래대응기금 추적기」 + 게시판을 제목·날짜 표로. 게시판 설정은 안 바꿉니다.
     추적기 자료는 독상이 하루 네 번 굽습니다(dokseong tools/bake.py 의 ISSUES) — 글을 더하려고 이 코드를 다시 붙일 일은 없습니다. -->
<style>
  #ib,#ib *,#ibt,#ibt *{box-sizing:border-box}
  #ib,#ibt{--brand:#00afec;--deep:#00698f;--ink:#0b1e28;--soft:#4a6473;--line:#dfeaf0;font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',sans-serif;color:var(--ink);word-break:keep-all}
  #ib{margin:0 0 44px;padding-bottom:44px;border-bottom:1px solid var(--line)}
  #ib a,#ibt a{color:inherit;text-decoration:none}
  #ib .top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start}
  #ib .card{display:flex;flex-direction:column;height:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;transition:border-color .15s,box-shadow .15s}
  #ib .card:hover{border-color:var(--brand);box-shadow:0 6px 18px rgba(11,30,40,.08)}
  /* 사진은 비율이 제각각이라 자르지 않고 전체를 보이고, 남는 자리에는 같은 사진을 흐리게 깝니다 */
  #ib .shot{position:relative;display:block;aspect-ratio:16/9;overflow:hidden;background:#eef7fb}
  #ib .shot::before,#ib .shot::after{content:'';position:absolute;inset:0;background:var(--p) center/contain no-repeat}
  #ib .shot::before{inset:-24px;background-size:cover;filter:blur(14px);opacity:.55}
  #ib .card b{flex:1;padding:18px 20px 12px;font-size:18px;line-height:1.5;font-weight:700}
  #ib .card small{padding:0 20px 18px;font-size:15px;font-variant-numeric:tabular-nums;color:var(--soft)}
  #ib .side{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  #ib .side:empty{display:none}
  #ib .side li{margin:0}
  #ib .side li+li{border-top:1px solid var(--line)}
  #ib .side a,#ib .side button{display:flex;gap:12px;align-items:center;width:100%;min-height:56px;padding:14px 18px;border:0;background:none;font:inherit;font-size:17px;line-height:1.45;font-weight:500;text-align:left;color:var(--ink);cursor:pointer}
  #ib .side button{font-weight:700}
  #ib .side button{background:linear-gradient(110deg,rgba(255,255,255,0) 42%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 58%) 130% 0/260% 100% no-repeat,linear-gradient(90deg,#00698f,#007aa8);color:#fff;animation:ib-shine 2.6s ease-in-out infinite}
  #ib .side button[aria-expanded=true]{animation:none}
  #ib .tl li:last-child::before{animation:ib-pulse 1.8s ease-out infinite}
  @keyframes ib-shine{0%{background-position:130% 0,0 0}60%,100%{background-position:-40% 0,0 0}}
  @keyframes ib-pulse{0%{box-shadow:0 0 0 0 rgba(0,175,236,.55)}100%{box-shadow:0 0 0 12px rgba(0,175,236,0)}}
  @media(prefers-reduced-motion:reduce){#ib .side button,#ib .tl li:last-child::before{animation:none}}
  #ib .side a::after,#ib .side button::after{content:'';flex:none;width:9px;height:9px;margin-left:auto;border:solid var(--brand);border-width:2px 2px 0 0;transform:rotate(45deg)}
  #ib .side button::after{margin-top:-5px;border-color:#fff;transform:rotate(135deg)}
  #ib .side button[aria-expanded=true]::after{margin-top:5px;transform:rotate(-45deg)}
  #ib .side a:hover{background:#f3f9fc}
  #ib .side button:hover{filter:brightness(1.08)}
  #ib .tl{margin-top:28px;padding:28px 30px 30px;border:1px solid var(--line);border-radius:14px;background:#f8fbfd}
  #ib .tl[hidden]{display:none}
  #ib .tl h2{margin:0 0 14px;font-size:22px;line-height:1.4;font-weight:800}
  #ib .tl ol{list-style:none;margin:0;padding:0}
  #ib .tl li{position:relative;display:grid;grid-template-columns:78px 36px 92px minmax(0,1fr);align-items:start;margin:0;padding:10px 12px 10px 0;border-radius:8px;font-size:16px;line-height:26px;word-break:keep-all}
  #ib .tl li::before{content:'';grid-area:1/2;justify-self:center;z-index:1;box-sizing:border-box;width:14px;height:14px;margin-top:6px;border:3px solid var(--brand);border-radius:50%;background:#fff}
  #ib .tl li::after{content:'';position:absolute;left:95px;top:0;bottom:0;width:2px;background:#c9e2ed}
  #ib .tl li:first-child::after{top:22px}
  #ib .tl li:last-child::after{bottom:auto;height:22px}
  #ib .tl li:last-child::before{background:var(--brand);box-shadow:0 0 0 4px #d3f0fc}
  #ib .tl time{grid-area:1/1;margin:0;font-size:15px;line-height:26px;font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--deep)}
  #ib .tl em{grid-area:1/3;justify-self:start;width:78px;margin:0;padding:0;border-radius:99px;background:#e2f5fd;font-size:14px;line-height:26px;font-style:normal;font-weight:700;text-align:center;white-space:nowrap;color:var(--deep)}
  #ib .tl .t{grid-area:1/4;font-weight:500;color:inherit;text-decoration:none}
  #ib .tl a.t::after{content:'';position:absolute;inset:0;border-radius:8px}
  #ib .tl li.on:hover{background:#e9f6fc}
  #ib .tl a.t:hover{text-decoration:underline;text-underline-offset:4px;color:var(--deep)}
  #ib .tl a.t:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
  #ib .tl li:last-child .t{font-weight:700}
  #ib .tl .go{display:inline-block;margin-top:18px;padding:13px 22px;border-radius:10px;background:var(--deep);font-size:16px;line-height:1.5;font-weight:700;color:#fff}
  #ib .tl .go:hover{background:var(--ink)}
  #ibt{width:100%;margin:0 0 28px;border-collapse:collapse;border-top:2px solid var(--ink)}
  #ibt th{padding:13px 12px;border-bottom:1px solid var(--line);background:#f5f9fb;font-size:15px;font-weight:700;text-align:left;color:var(--soft)}
  #ibt td{padding:15px 12px;border-bottom:1px solid var(--line);font-size:16.5px;line-height:1.55}
  #ibt td a{display:block;font-weight:500}
  #ibt th:last-child,#ibt td:last-child{width:132px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;color:var(--soft)}
  #ibt td:last-child{font-size:15px}
  #ibt tbody tr:hover{background:#f3f9fc}
  #ibt a:hover{text-decoration:underline;text-underline-offset:4px;color:var(--deep)}
  @media(max-width:1320px){
    #ib{margin-left:16px;margin-right:16px}
    #ibt{width:calc(100% - 32px);margin-left:16px;margin-right:16px}
  }
  @media(max-width:900px){
    #ib .top{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    #ib .side{grid-column:1/-1}
  }
  @media(max-width:640px){
    #ib{margin-bottom:28px;padding-bottom:28px}
    #ib .top{grid-template-columns:minmax(0,1fr);gap:12px}
    #ib .card{display:grid;grid-template-columns:116px minmax(0,1fr);grid-template-rows:1fr auto;min-height:104px}
    #ib .shot{grid-area:1/1/3/2;aspect-ratio:auto;height:auto;align-self:stretch}
    #ib .card b{grid-area:1/2}
    #ib .card small{grid-area:2/2}
    #ib .card b{padding:13px 14px 4px;font-size:16px;line-height:1.45}
    #ib .card small{padding:0 14px 12px;font-size:14px}
    #ib .tl{margin-top:16px;padding:20px 16px}
    #ib .tl h2{margin-bottom:10px;font-size:19px}
    #ib .tl .go{display:block;text-align:center}
    #ib .tl li{grid-template-columns:24px auto minmax(0,1fr);padding:9px 4px 9px 0}
    #ib .tl li::before{grid-area:1/1}
    #ib .tl li::after{left:11px}
    #ib .tl time{grid-area:1/2;min-width:70px;margin:0 10px 0 8px;text-align:left}
    #ib .tl em{grid-area:1/3;width:auto;padding:0 11px}
    #ib .tl .t{grid-area:2/2/3/4;margin:3px 0 0 8px}
    #ibt thead{display:none}
    #ibt tr{display:block;padding:13px 2px;border-bottom:1px solid var(--line)}
    #ibt td,#ibt td:last-child{display:block;width:auto;padding:0;border:0;text-align:left}
    #ibt td:last-child{margin-top:3px;font-size:14px}
  }
</style>
<script>
(function () {
  function run() {
  if (document.getElementById('ibt')) return;                 /* PC·모바일에 둘 다 붙어도 한 번만 */
  var DATA = 'https://dok.action.or.kr/data/timeline.json';
  var q = new URLSearchParams(location.search), board = document.querySelector('.widget.board._list_wrap');
  if (!board || q.get('bmode')) return;                       /* 글을 연 화면은 건드리지 않습니다 */
  var posts = [].map.call(board.querySelectorAll('a.post_link_wrap'), function (a) {
    var box = a.querySelector('.title-block'), d = a.querySelector('small.date'), th = a.querySelector('.card-thumbnail-wrap');
    if (!box || !d) return null;
    box = box.cloneNode(true);
    [].forEach.call(box.querySelectorAll('em,span'), function (e) { e.remove(); });
    return { url: a.getAttribute('href'), title: box.textContent.replace(/\s+/g, ' ').trim(), at: d.getAttribute('title') || '', bg: th ? th.style.backgroundImage : '' };
  }).filter(function (p) { return p && p.title; });
  if (!posts.length) return;                                  /* 못 읽으면 원래 카드 목록 그대로 */

  function el(n, t, c) { var e = document.createElement(n); if (t) e.textContent = t; if (c) e.className = c; return e; }
  function link(href, t, c) { var a = el('a', t, c); a.href = href; if (a.origin !== location.origin) { a.target = '_blank'; a.rel = 'noopener'; } return a; }

  /* 글 목록을 표로. 쪽 번호·검색은 게시판 것을 그대로 씁니다 */
  var table = el('table'), head = table.createTHead().insertRow(), body = table.createTBody();
  table.id = 'ibt';
  ['제목', '날짜'].forEach(function (t) { var th = el('th', t); th.scope = 'col'; head.appendChild(th); });
  posts.forEach(function (p) { var tr = body.insertRow(); tr.insertCell().appendChild(link(p.url, p.title)); tr.insertCell().textContent = p.at.slice(0, 10); });
  var cards = board.querySelector('.list-style');
  cards.parentNode.insertBefore(table, cards);
  cards.style.display = 'none';

  /* 위쪽은 첫 화면에서만 — 검색·다음 쪽·분류에서는 표만 */
  if (+(q.get('page') || 1) > 1 || q.get('keyword') || q.get('category')) return;
  var ib = el('section'), top = el('div', '', 'top'), side = el('ul', '', 'side');
  ib.id = 'ib';
  posts.slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; }).slice(0, 2).forEach(function (p) {
    var a = link(p.url, '', 'card'), s = el('span', '', 'shot');
    if (p.bg) s.style.setProperty('--p', p.bg);
    a.appendChild(s); a.appendChild(el('b', p.title)); a.appendChild(el('small', p.at.slice(0, 10)));
    top.appendChild(a);
  });
  top.appendChild(side); ib.appendChild(top);
  board.parentNode.insertBefore(ib, board);

  fetch(DATA).then(function (r) { return r.json(); }).then(function (d) {
    d.issues.forEach(function (s, i) {
      var li = el('li'), b = el('button', s.title), tl = el('div', '', 'tl'), ol = el('ol'), join = 'https://dok.action.or.kr/#camp-' + s.camp;
      b.type = 'button'; b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-controls', tl.id = 'ib-tl-' + i);
      s.items.forEach(function (p) {
        var row = el('li', '', p.url ? 'on' : ''), day = p.date.split('-'), t = el('time', +day[1] + '월 ' + +day[2] + '일');
        t.dateTime = p.date;
        row.appendChild(t); row.appendChild(el('em', p.kind)); row.appendChild(p.url ? link(p.url, p.title, 't') : el('span', p.title, 't')); ol.appendChild(row);
      });
      tl.hidden = true;
      tl.appendChild(el('h2', s.title)); tl.appendChild(ol); tl.appendChild(link(join, '밑빠진 독상에서 이 감시에 참여하기 →', 'go'));
      b.onclick = function () {
        tl.hidden = !tl.hidden;
        b.setAttribute('aria-expanded', String(!tl.hidden));
        if (!tl.hidden) tl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      };
      li.appendChild(b); side.appendChild(li); ib.appendChild(tl);
      var go = el('li'); go.appendChild(link(join, '밑빠진 독상에서 참여하기')); side.appendChild(go);
    });
  }).catch(function () {});                                   /* 못 받으면 오른쪽 목록만 비웁니다 */
  }
  /* 이 코드는 게시판보다 먼저 그려집니다 — 다 그려진 뒤에 돌립니다 */
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run); else run();
})();
</script>
<!-- CAMPAIGNERS:ACTIVITY-BUDGET-TRACKER END -->
