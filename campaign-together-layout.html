<style>
/* ═══════════════════════════════════════════════════════════════
   캠페인 목록 페이지

   캠페인 = 끝나는 날짜가 있는 것. 마감이 지나면 '종료' 탭으로 내려가고,
   그 결과는 해당 활동 페이지의 '결과' 칸에 사건으로 정리됩니다.

   ★ 2026-08-26 재작업 — 왜 다시 짰나
     사진이 있는 카드와 없는 카드가 한 격자 안에서 따로 놀았습니다.
     사진 있는 것은 꽉 찬 그림, 없는 것은 점선 빈 칸이라 "같은 단체가 만든 화면"으로
     안 보였습니다. 사진 수급이 쉽지 않다는 것이 전제이므로, **사진에 기대지 않는 틀**로
     바꿨습니다.

     새 틀 : 모든 카드가 [색 타일] 위에 [같은 어둠] 을 덮고 [흰 글씨] 를 얹습니다.
             사진이 있으면 그 색 타일 자리에 사진이 옅게 깔릴 뿐, 나머지는 똑같습니다.
             그래서 사진이 있든 없든 카드의 무게가 같습니다.
     이 방식은 홈 첫 화면(.slide)과 같은 것입니다 — 두 화면이 한 벌로 읽힙니다.

   색·글꼴·모양은 DESIGN.md 의 한 벌을 그대로 씁니다.

   캠페이너스 페이지 /77 에 붙이는 캠페인 목록입니다.
   ═══════════════════════════════════════════════════════════════ */

@font-face{font-family:'GmarketSans';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');font-weight:700;font-display:swap}

#iss{
  /* ── DESIGN.md 의 한 벌. 다섯 화면이 같은 값을 씁니다 ── */
  --brand:#00afec; --deep:#0079a6; --tint:#e2f5fd; --band:#eef7fb; --navy:#062330;
  --ink:#0b1e28; --soft:#4a6473; --faint:#7d95a3; --line:#d5e4eb; --paper:#f1f6f8;
  --flag:#9a5c06; --flag-bg:#fff4e1; --flag-line:#ecd3a2;

  margin-left:calc(50% - 50vw + var(--ah-sb, 0px) / 2);margin-right:calc(50% - 50vw + var(--ah-sb, 0px) / 2);
  background:#fff; color:var(--ink); line-height:1.65;
  font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,sans-serif;
  word-break:keep-all; -webkit-font-smoothing:antialiased;
}
#iss *{box-sizing:border-box}
#iss h1,#iss h2,#iss h3{margin:0; letter-spacing:-.022em; font-family:GmarketSans,'Pretendard Variable',sans-serif}
#iss p{margin:0}
#iss a{color:inherit; text-decoration:none}
#iss ul{list-style:none; margin:0; padding:0}
#iss :focus-visible{outline:2.5px solid var(--brand); outline-offset:3px}
#iss .wrap{width:min(1120px,calc(100% - 48px)); margin:0 auto}
#iss .tbd{background:var(--flag-bg); color:var(--flag); border:1px dashed var(--flag-line);
  border-radius:999px; padding:1px 8px; font-size:.78em; font-weight:700; white-space:nowrap}

/* ───── 맨 위 ─────  (2026-08-27 다시 짬)
   활동 페이지와 같은 틀입니다. 예전에는 짙은 남색 띠였는데, 활동 페이지에서
   "띠가 겹겹이 쌓여 마음에 안 든다"는 지적을 받아 색면을 걷어냈습니다.
   여기만 남색으로 두면 이번엔 캠페인만 다른 사이트로 보입니다. */
#iss .top{padding:clamp(20px,2.4vw,30px) 0 0; border-bottom:2px solid var(--ink)}
#iss .crumb{font-size:12.5px; font-weight:600; color:var(--deep)}
#iss .crumb a{color:var(--deep)}
#iss .crumb a:hover{text-decoration:underline; text-underline-offset:3px}
#iss .crumb span{opacity:.45; margin:0 6px}
#iss .top h1{
  margin-top:clamp(18px,2vw,26px);
  font-size:clamp(28px,4.4vw,46px); font-weight:700; line-height:1.24;
  letter-spacing:-.03em; text-wrap:balance
}
#iss .top h1 em{display:block; font-style:normal; color:var(--deep)}
#iss .top .by{
  margin-top:14px; padding-bottom:clamp(24px,2.8vw,34px);
  font-size:clamp(14.5px,1.2vw,16.5px); color:var(--soft); max-width:54ch; line-height:1.7
}

/* ───── 탭 ─────
   2026-09-01 사용자 지시로 가운데로 옮기고 키웠습니다("너무 작다").
   이 화면에서 제일 먼저 눌러야 하는 것이라 눈에 걸려야 합니다. */
#iss .tabs{
  display:flex; justify-content:center; gap:10px;
  padding:clamp(28px,3.4vw,44px) 0 clamp(22px,2.6vw,32px)
}
#iss .tab{
  border:2px solid var(--line); background:#fff; color:var(--soft); border-radius:999px;
  padding:18px 58px; font-size:clamp(19px,2.1vw,24px); font-weight:700;
  font-family:GmarketSans,inherit; letter-spacing:-.02em;
  cursor:pointer; transition:.15s
}
#iss .tab:hover{border-color:var(--brand); color:var(--deep)}
#iss .tab[aria-selected="true"]{background:var(--brand); border-color:var(--brand); color:#fff}
#iss .tab .n{opacity:.6; margin-left:9px; font-size:.72em; font-variant-numeric:tabular-nums}

/* ───── 카드 ─────  (2026-08-27 다시 짬)
   사용자 지시: "글자부분과 사진부분을 철저하게 분리해. 사진에서 통일감을 줄 수 없어.
   그러니 액자 같은 틀에서 통일감을 줘야해."

   전에는 사진을 40% 로 깔고 그 위에 글씨를 얹었습니다. 사진마다 밝기·구도가 달라
   같은 어둠을 덮어도 카드가 제각각으로 보였고, 글씨가 사진에 묻히기도 했습니다.

   이제 둘이 겹치지 않습니다.
     위 = 액자. 사진은 액자 안에만 있고 밖으로 안 나옵니다.
     아래 = 흰 바탕 글자 칸. 사진이 무엇이든 글씨는 늘 같은 자리·같은 색입니다.
   통일감은 사진이 아니라 액자가 냅니다 —
   모든 카드가 같은 비율(4:3), 같은 테두리, 같은 여백을 씁니다. */
/* display 를 준 칸이라 hidden 만으로는 안 숨습니다. 이 한 줄이 없으면 탭을 안 눌러도
   종료 목록이 진행 중 밑에 늘 붙어 보입니다. */
#iss .grid[hidden]{display:none}
#iss .grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
  gap:clamp(16px,1.8vw,22px); padding-bottom:clamp(48px,6vw,88px)}
#iss .card{
  display:flex; flex-direction:column;
  background:#fff; border:1px solid var(--line);
  transition:transform .2s, border-color .2s, box-shadow .2s
}
#iss .card:hover{
  transform:translateY(-4px); border-color:var(--brand);
  box-shadow:0 14px 30px rgba(6,35,48,.10)
}

/* ── 액자 ──
   비율을 4:3 으로 못박아 사진이 세로든 가로든 같은 크기 액자에 담깁니다.
   안쪽 테두리 한 줄(::after)이 사진과 틀을 갈라 줍니다 — 액자의 마감선입니다. */
#iss .card-shot{
  position:relative; display:block; aspect-ratio:4/3; overflow:hidden;
  /* 매트(사진 둘레 여백) 색은 카드마다 다르지 않습니다. 액자가 똑같아야 통일감이 납니다. */
  background:var(--band); border-bottom:1px solid var(--line)
}
/* contain 입니다. cover 로 하면 액자에 맞추려고 사진을 잘라 냅니다 —
   우리 캠페인 사진은 대부분 포스터·카드뉴스라 잘리면 제목부터 날아갑니다
   (실제로 '한강버스 주요 연혁'의 '한' 과 '10만원 예산편성투표'의 왼쪽이 잘렸습니다).
   액자는 고정하고 그림은 온전히 담습니다. */
#iss .card-shot img{
  position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block;
  transition:transform .5s
}
#iss .card:hover .card-shot img{transform:scale(1.04)}
#iss .card-shot::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(6,35,48,.14)
}
/* 사진이 아직 없는 칸. 점선 빈 상자로 두지 않습니다 — 그 카드만 미완성으로 보입니다.
   대신 색 타일에 큰 글자를 깔아 사진 있는 카드와 무게를 맞춥니다. */
#iss .card-shot .mark{
  position:absolute; inset:0; display:grid; place-items:center; margin:0;
  background:var(--tile,var(--navy));
  font-family:GmarketSans,sans-serif; font-size:clamp(44px,5vw,64px); font-weight:700;
  line-height:1; color:rgba(255,255,255,.22); letter-spacing:-.04em
}

/* ── 글자 칸 ──
   흰 바탕입니다. 사진 위가 아니라서 어떤 사진이 와도 읽는 조건이 같습니다. */
#iss .card-in{
  display:flex; flex-direction:column; align-items:flex-start; gap:8px;
  padding:clamp(16px,1.7vw,20px); flex:1
}
#iss .card-in h3{font-size:clamp(16px,1.4vw,19px); font-weight:700; line-height:1.4}
#iss .new-window{font-size:.78em; margin-left:.28em; color:var(--deep); vertical-align:.12em}
#iss .card:hover h3{color:var(--deep)}
#iss .card-in p{font-size:13.5px; line-height:1.6; color:var(--soft)}
/* 마감일. 캠페인이 캠페인인 이유이자 언제 종료로 내릴지 알려 주는 표시입니다.
   글자 칸 맨 아래에 붙여, 카드 높이가 달라도 마감일 줄은 나란히 놓입니다. */
#iss .due{
  margin-top:auto; padding-top:10px;
  font-size:12.5px; font-weight:800; color:var(--deep)
}
#iss .card.done .due{color:var(--faint); font-weight:700}
/* 남은 날짜. 액자가 아니라 마감일 줄 안에 있습니다 —
   액자 위에 뱃지를 얹으면 포스터 제목을 가립니다(실제로 한강버스 포스터가 그랬습니다).
   액자에는 아무것도 얹지 않는 것이 이 카드의 규칙입니다. */
#iss .due .dday{
  display:inline-block; margin-right:7px;
  background:var(--brand); color:#fff;
  border-radius:999px; padding:3px 10px;
  font-family:GmarketSans,sans-serif; font-size:12.5px; font-weight:700;
  line-height:1.3; letter-spacing:-.02em
}
#iss .card.done .due .dday{background:var(--faint)}

#iss .empty{grid-column:1/-1; border:1px dashed var(--line); padding:56px 20px;
  text-align:center; color:var(--faint); font-size:14.5px}

@media(max-width:900px){ #iss .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(max-width:560px){
  #iss .wrap{width:min(100% - 32px,1120px)}
  #iss .top{padding-top:16px}
  #iss .crumb{margin-bottom:18px}
  #iss .tabs{padding:24px 0 16px}
  #iss .tab{flex:1; padding:16px 8px; font-size:18px}
  #iss .grid{grid-template-columns:minmax(0,1fr); gap:14px}
  /* ⚠️ 예전에 여기 #iss .card{aspect-ratio:16/10} 이 있었습니다.
     카드를 가로로 눕힌다는 뜻이었는데, 카드는 flex-direction:column 이라
     눕혀지지 않고 가로로 부풀기만 했습니다. 높이가 내용으로 정해지는 칸에
     aspect-ratio 를 주면 그 높이에 비례해 폭이 역산됩니다 — 390px 화면에서
     칸이 581px 로 불어나 화면이 가로로 쪼개졌습니다. 다시 넣지 마세요.
     사진 칸을 줄이지도 않습니다 — 캠페인 사진은 대부분 포스터라 작은 썸네일로
     줄이면 제목을 읽을 수 없습니다 (DESIGN.md 액자 규칙). */
}
@media(prefers-reduced-motion:reduce){ #iss *{transition:none!important; animation:none!important} }
</style>

  <section class="top"><div class="wrap">

    <!-- ───────── 진행 중 ─────────
         홈 첫 화면(.slide)에 올라간 셋과 **같은 셋**입니다. 한쪽을 고치면 여기도 고칠 것.

         (걷어낸 둘: 2026 지방선거 서울시민행동 · 한강버스 주민감사청구.

         ⚠️ 탭은 남깁니다. 이 화면의 뼈대가 '진행 중 / 종료' 두 갈래이고,
            캠페인이 끝나면 여기로 내려온다는 것을 보여 주는 자리이기 때문입니다.
            첫 캠페인이 끝나면 여기에 카드를 넣고 탭의 숫자를 고치세요. -->
